<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a86ab">
  <title>Gestión Morelia</title>
  <link rel="icon" href="assets/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/gestion.css">
</head>
<body>
<div class="acceso" id="acceso" hidden>
  <form class="tarjeta" id="form-acceso">
    <div>
      <h1>Gestión · Morelia</h1>
      <p class="bajada" style="margin:4px 0 0">Albaranes, precios de compra, escandallos y ventas.</p>
    </div>
    <div class="campo">
      <label for="clave">Contraseña</label>
      <input type="password" id="clave" autocomplete="current-password" required>
    </div>
    <label class="chk"><input type="checkbox" id="recordar" checked> Recordar en este dispositivo</label>
    <button class="btn" type="submit">Entrar</button>
    <p class="error-txt" id="error-acceso" hidden></p>
  </form>
</div>

<div id="app" hidden>
  <header class="cab">
    <div class="cab-in">
      <div>
        <h1>Gestión · Morelia</h1>
        <div class="sub">Pizza Pija S.L. · Plaça Comercial 7</div>
      </div>
    </div>
  </header>

  <div class="marco">
    <nav class="nav" aria-label="Secciones">
      <button data-vista="resumen"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4h6v4h-6zM4 20h6v-3H4z"/></svg>Resumen</button>
      <button data-vista="albaranes"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Albaranes<span class="cuenta" id="cuenta-albaranes" hidden></span></button>
      <button data-vista="precios"><svg viewBox="0 0 24 24"><path d="M3 12l9-9h7v7l-9 9z"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>Precios</button>
      <button data-vista="escandallos"><svg viewBox="0 0 24 24"><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6M9 11h6"/></svg>Escandallos</button>
      <button data-vista="ventas"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Ventas</button>
      <span class="separador"></span>
      <button data-vista="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
    </nav>

    <main>
      <section class="vista" id="v-resumen" hidden></section>
      <section class="vista" id="v-albaranes" hidden></section>
      <section class="vista" id="v-editor" hidden></section>
      <section class="vista" id="v-precios" hidden></section>
      <section class="vista" id="v-escandallos" hidden></section>
      <section class="vista" id="v-ventas" hidden></section>
      <section class="vista" id="v-ajustes" hidden></section>
    </main>
  </div>
</div>

<div class="tip" id="tip" hidden></div>
<script type="module" src="assets/gestion.js"></script>
</body>
</html>
